<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="anantdark">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0e"/>
      <stop offset="45%" stop-color="#0f1a17"/>
      <stop offset="100%" stop-color="#071412"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4a8"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2dd4a8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4a8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2dd4a8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <circle cx="980" cy="70" r="120" fill="#2dd4a8" opacity="0.08" filter="url(#soft)"/>
  <circle cx="160" cy="300" r="90" fill="#5eead4" opacity="0.06" filter="url(#soft)"/>

  <rect x="0" y="0" width="6" height="360" fill="url(#accent)"/>

  <text x="64" y="72" fill="#6b8f86" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="4">INDIA · AI ENGINEER · PYTHON</text>

  <text x="64" y="160" fill="#ecfdf8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="700" letter-spacing="1">anantdark</text>

  <rect x="64" y="178" width="320" height="2" fill="url(#glow)"/>
  <rect x="64" y="178" width="120" height="2" fill="url(#accent)"/>

  <text x="64" y="230" fill="#a7c4bc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">Automating my life, one program at a time.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <rect x="64" y="268" width="92" height="32" rx="6" fill="#12201c" stroke="#2dd4a8" stroke-opacity="0.35"/>
    <text x="110" y="288" text-anchor="middle" fill="#5eead4">Python</text>

    <rect x="168" y="268" width="72" height="32" rx="6" fill="#12201c" stroke="#2dd4a8" stroke-opacity="0.35"/>
    <text x="204" y="288" text-anchor="middle" fill="#5eead4">AI</text>

    <rect x="252" y="268" width="128" height="32" rx="6" fill="#12201c" stroke="#2dd4a8" stroke-opacity="0.35"/>
    <text x="316" y="288" text-anchor="middle" fill="#5eead4">Automation</text>

    <rect x="392" y="268" width="108" height="32" rx="6" fill="#12201c" stroke="#2dd4a8" stroke-opacity="0.35"/>
    <text x="446" y="288" text-anchor="middle" fill="#5eead4">Privacy</text>
  </g>

  <g transform="translate(820, 96)">
    <rect width="300" height="180" rx="12" fill="#0b1412" stroke="#1f3a33" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="5" fill="#ef4444" opacity="0.85"/>
    <circle cx="42" cy="22" r="5" fill="#eab308" opacity="0.85"/>
    <circle cx="62" cy="22" r="5" fill="#22c55e" opacity="0.85"/>
    <line x1="0" y1="40" x2="300" y2="40" stroke="#1f3a33"/>
    <text x="20" y="72" fill="#6b8f86" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">~/code</text>
    <text x="20" y="100" fill="#2dd4a8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">$ ship --useful</text>
    <text x="20" y="128" fill="#a7c4bc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">building with python</text>
    <text x="20" y="156" fill="#a7c4bc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">&amp; applied AI</text>
    <text x="20" y="184" fill="#2dd4a8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">▌</text>
  </g>
</svg>
